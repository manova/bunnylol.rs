default_search = "google"

[history]
enabled = false

[server]
address = "127.0.0.1"
port = 18766
log_level = "off"

[[pattern_bindings]]
name = "tickets"
pattern = '(?P<ticket>ENG-[0-9]+)'
url = "https://tracker.example.com/browse/{ticket}"
description = "Engineering ticket"

[[pattern_bindings]]
name = "pull-requests"
pattern = '#(?P<number>[0-9]+)'
url = "https://github.com/example/repo/pull/{number}"
description = "Pull request in the configured repository"
